# Example only. Keep the real configuration on the phone, outside the module.
# Fill in the network identity and device keys before installing.
instance_name = "example"
hostname = "phone"
ipv4 = "192.0.2.10/24"
dhcp = false
listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010"]

[network_identity]
network_name = "example"
network_secret = ""

[secure_mode]
enabled = true
local_private_key = ""
local_public_key = ""

[flags]
dev_name = "easytier0"
private_mode = true
enable_encryption = true
default_protocol = "tcp"
latency_first = true

# Module-specific settings. The EasyTier core ignores this table.
[magisk.easytier]
state_dir = "/data/adb/easytier"
rpc_portal = "127.0.0.1:15888"
route_priority = 900
root_rule_priority = 11900
root_rule_target = 18000
log_size_mb = 2
log_count = 2
dns_servers = ["1.1.1.1", "8.8.8.8"]
